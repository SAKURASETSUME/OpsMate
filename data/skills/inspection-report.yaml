name: inspection-report
label: 巡检报告框架生成
triggers: [巡检报告, 巡检, 检查报告, 健康检查报告, 日常巡检, 周报 巡检]
methodology: |
  按四象限生成巡检报告框架（用户补充数据后成稿）：
  1. 【容量】磁盘使用率与增长趋势、内存 available、CPU 均值峰值、inode、关键分区
     （数据库/日志盘单列）；超过 80% 的标黄给出预计写满时间。
  2. 【性能】load 基线对比、慢查询数/耗时、队列堆积（MQ 深度）、接口 P95（如有监控数据）。
  3. 【安全】异常登录（last/lastb、fail2ban）、开放端口变化（与基线 diff）、证书到期时间、
     待更新安全补丁、防火墙规则变更。
  4. 【告警与异常】周期内告警清单与处置结果、未恢复告警、遗留问题与责任人。
  附：巡检结论（健康/亚健康/异常三档判定依据）+ 下周期建议动作清单。
  提醒用户：巡检的价值在趋势对比，让用户尽量提供上一期数据。
example_question: 帮我生成一份 10 台服务器的月度巡检报告框架
