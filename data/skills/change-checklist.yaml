name: change-checklist
label: 变更 Checklist 生成
triggers: [变更 checklist, 变更方案, 变更计划, 上线 checklist, 发布前检查, 变更评审, 回滚方案]
methodology: |
  为用户的变更生成四要素 checklist，缺一不可：
  1. 【备份】改什么就备份什么：配置文件（cp 带 .bak.$(date +%F% H%M)）、数据库（mysqldump/pg_dump
     或快照）、状态（如 keepalived/集群当前角色）；写明备份文件放哪、怎么验证备份可用。
  2. 【回滚】每一步都要有对应的回滚动作与判定条件（如"5 分钟内错误率 >1% 即回滚"）；
     回滚路径要能在 5 分钟内执行完，回滚脚本先写好再开始变更。
  3. 【窗口】明确的开始/结束时间与超时升级机制（到点没完成是继续还是回滚，谁拍板）；
     避开业务高峰与备份任务撞点。
  4. 【验证】变更后验证清单：服务状态、端口监听、核心接口/命令实测、监控指标基线对比；
     观察期（建议 30-60 分钟）内的盯盘项。
  输出格式建议：表格（步骤/操作人/命令/预期结果/回滚动作），按步骤编号可勾选。
example_question: 帮我生成一份生产 nginx 升级到 1.26 的变更 checklist
