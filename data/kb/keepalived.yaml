    notes: 改动先 keepalived -t，再按服务支持 reload 或维护窗口重启；放在 global_defs，确保该用户存在。
    danger: low
    tags:
    - vrrp
  - name: enable_script_security
    default: 未启用
    section: global
    syntax: enable_script_security
