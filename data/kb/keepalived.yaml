  - name: ip addr show
    syntax: ip addr show
    example: ip addr show dev eth0
    desc: 查看接口地址与 VIP。
    notes: eth0 替换为实际接口。
    danger: false
    tags:
    - 运行命令
  - name: journalctl -u keepalived
    syntax: journalctl -u keepalived
    example: journalctl -u keepalived -f
    desc: 跟踪服务日志。
