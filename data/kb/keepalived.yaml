software: keepalived
label: Keepalived
version_ref: Keepalived 2.x；以本机 man keepalived.conf 为准
generated: AI 整理，使用前请核对官方文档
sources:
- https://www.keepalived.org/documentation/keepalived-conf/
- https://keepalived.org/documentation/user-guide/configuration-synopsis/
templates:
- name: 主备双节点模板（MASTER/BACKUP）
  desc: VRRP 主备 + 后端健康检查脚本；备节点只需改 state/priority 两处。
  content: "global_defs {\n    router_id LB_01\n    vrrp_skip_check_adv_addr\n   \
    \ enable_script_security\n    script_user keepalived_script\n}\n\nvrrp_script\
    \ chk_service {\n    script \"/usr/local/bin/check_service.sh\"\n    interval\
    \ 2\n    timeout 1\n    weight -30\n    fall 2\n    rise 2\n}\n\nvrrp_instance\
    \ VI_1 {\n    # 主节点 state MASTER / priority 100；备节点改为 state BACKUP / priority\
    \ 90\n    state MASTER\n    interface eth0\n    virtual_router_id 51\n    priority\
    \ 100\n    advert_int 1\n    authentication {\n        auth_type PASS\n      \
    \  auth_pass example\n    }\n    virtual_ipaddress {\n        192.0.2.100/24 dev\
    \ eth0\n    }\n    track_script {\n        chk_service\n    }\n    notify_master\
    \ \"/usr/local/bin/notify.sh master\"\n    notify_backup \"/usr/local/bin/notify.sh\
    \ backup\"\n}\n"
categories:
- id: cli
  label: 启停与运行命令
  entries:
  - name: systemctl start keepalived
    syntax: systemctl start keepalived
    example: systemctl start keepalived
    desc: 启动高可用服务。
    notes: 启动前确认 VRID、优先级与 VIP 不冲突。
    danger: medium
    tags:
    - 运行命令
  - name: systemctl stop keepalived
    syntax: systemctl stop keepalived
    example: systemctl stop keepalived
    desc: 停止服务，可能触发 VIP 漂移。
    notes: 在维护窗口操作。
    danger: high
    tags:
    - 运行命令
  - name: systemctl restart keepalived
    syntax: systemctl restart keepalived
    example: systemctl restart keepalived
    desc: 重启服务并重新选举。
    notes: 先做语法检查，关注双主风险。
    danger: high
    tags:
    - 运行命令
  - name: systemctl status keepalived
    syntax: systemctl status keepalived
    example: systemctl status keepalived
    desc: 查看服务状态。
    notes: 只读，无配置生效动作。
    danger: false
    tags:
    - 运行命令
  - name: keepalived -t
    syntax: keepalived -t
    example: keepalived -t -f /etc/keepalived/keepalived.conf
    desc: 检查配置语法，不启动服务。
    notes: 通过不代表网络与脚本运行一定正确。
    danger: false
    tags:
    - 运行命令
  - name: keepalived -f
    syntax: keepalived -f
    example: keepalived -f /etc/keepalived/keepalived.conf
    desc: 使用指定配置启动。
    notes: 避免与 systemd 管理的实例重复启动。
    danger: medium
    tags:
    - 运行命令
  - name: keepalived --help
    syntax: keepalived --help
    example: keepalived --help
    desc: 查看本机支持的参数。
    notes: 无配置生效动作。
    danger: false
    tags:
    - 运行命令
  - name: keepalived -v
    syntax: keepalived -v
    example: keepalived -v
    desc: 查看版本与构建选项。
    notes: 无配置生效动作。
    danger: false
    tags:
    - 运行命令
  - name: ipvsadm -Ln
    syntax: ipvsadm -Ln
    example: ipvsadm -Ln
    desc: 查看 LVS 转发表。
    notes: 需要单独安装 ipvsadm 和适当权限。
    danger: false
    tags:
    - 运行命令
  - name: ipvsadm -C
    syntax: ipvsadm -C
    example: ipvsadm -C
