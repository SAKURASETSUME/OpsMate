    notes: 改文件后维护窗口重启；支持的参数可 CONFIG SET 热改，持久化需另行确认；按核数与负载测试，不能假定命令执行并行。
    danger: low
    tags:
    - server
  - name: slowlog-log-slower-than
    default: '10000'
