    notes: 改文件后维护窗口重启；支持的参数可 CONFIG SET 热改，持久化需另行确认；已不推荐，优先 ACL；禁用 CONFIG 影响运维。
    danger: medium
    tags:
    - server
  - name: maxclients
    default: '10000'
    section: server
    syntax: maxclients 10000
