<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsMate 运维提效智能体</title>
  <script>
    // 首帧前应用主题，避免暗/亮闪切；偏好存 localStorage：auto/dark/light
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("opsmate-theme") || "auto"; } catch (e) { /* 忽略 */ }
      var preferDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = pref === "auto" ? (preferDark ? "dark" : "light") : pref;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <!-- vendored 零构建前端库（§4.5），随后 app.js 挂载 Vue 应用 -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
